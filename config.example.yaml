# Copy to config.yaml (ignored by Git). Paths are relative to the repository.
# YAML anchors (&name / *name) share values; each workflow can override them.
shared:
  runs: &runs [../HeatStressBench/.hsb/runs/REPLACE_WITH_ERA5_RUN]
  start_date: &start 2025-01-01
  end_date: &end 2025-12-31
  implementations: &targets
    - argonne-liljegren-c
    - heatstress
    - meteor
    - thermofeel
    - kwodzicki-pywbgt
    - kong-huber-pywbgt
  pairwise_implementations: &pair_targets
    - argonne-liljegren-c
    - heatstress
    - kong-huber-pywbgt
    - kwodzicki-pywbgt
    - meteor
    - thermofeel
  boundary_cache: &boundaries data/boundaries
  population: &population results/REPLACE_WITH_ERA5_RUN/population/population.parquet

# Omit a workflow or use [] to disable it. Python fixes the execution order;
# lists select settings sections, run one at a time (including country variants).
pipeline:
  output_root: results/REPLACE_WITH_ERA5_RUN/pipeline
  steps:
    population: [population]
    country_cells: [country_cells]
    extract_country: [extract_country]
    daily_pairwise: [daily_pairwise]
    yearly_pairwise: [yearly_pairwise]
    iso7243: [iso7243, iso7243_jpn, iso7243_tha]
    plot_iso7243: [plot_iso7243, plot_iso7243_jpn, plot_iso7243_tha]
    plot_non_consensus: [plot_non_consensus, plot_non_consensus_jpn, plot_non_consensus_tha]
    plot_non_consensus_stack: [plot_non_consensus_stack]
    country_classification: [country_classification, country_classification_tha]
    quantiles: [quantiles]
    quantile_spread: [quantile_spread]
    plot_quantile_spread: [plot_quantile_spread]

# Run daily comparisons before annual aggregation.
daily_pairwise:
  hsb_run_paths: *runs
  start_date: *start
  end_date: *end
  implementations: *pair_targets
  sample_scope: all-implementations # or pairwise
  output_root: &daily results/REPLACE_WITH_ERA5_RUN/pairwise/daily
  workers: 4 # two Polars compute threads per worker by default
  overwrite: false

yearly_pairwise:
  input_root: *daily
  output_root: results/REPLACE_WITH_ERA5_RUN/pairwise/yearly
  start_date: *start
  end_date: *end
  reference_implementation: argonne-liljegren-c
  export_implementations:
    - heatstress
    - meteor
    - thermofeel
    - kwodzicki-pywbgt
    - kong-huber-pywbgt

# For a country product, set hsb_run_paths: null and country_cache to the
# extracted observations.parquet; choose a separate output_root.
quantiles:
  hsb_run_paths: *runs
  country_cache: null
  start_date: *start
  end_date: *end
  implementations: *targets
  output_root: &quantiles results/REPLACE_WITH_ERA5_RUN/cellwise/quantiles
  probabilities: [0.50, 0.95]
  exact_validation_cells: 100
  exact_validation_seed: 0
  date_workers: 2
  replay_workers: 2
  overwrite: false

population:
  input_raster: data/population/landscan-global-2024/landscan-global-2024.tif
  output_root: results/REPLACE_WITH_ERA5_RUN/population
  overwrite: false

quantile_spread:
  input_root: *quantiles
  output_root: &spread results/REPLACE_WITH_ERA5_RUN/cellwise/spread
  quantities: [wbgt, tnwb, tg]
  weighting: geometry # none, geometry, or population
  population_weights_path: *population # null skips coverage; optional for geometry/none

plot_quantile_spread:
  output_root: *spread

iso7243: &iso7243_settings
  hsb_run_paths: *runs
  country_cache: null
  start_date: *start
  end_date: *end
  implementations: *targets
  thresholds_c: [25, 26, 28, 30, 33]
  sample_scope: all-implementations
  output_root: &iso7243 results/REPLACE_WITH_ERA5_RUN/cellwise/iso7243
  date_workers: 4
  batch_size: 65536
  overwrite: false

plot_iso7243: &plot_iso7243_settings
  input_root: *iso7243
  output_directory: null # defaults to input_root/figures
  population_weights_path: *population

plot_non_consensus: &plot_non_consensus_settings
  input_root: *iso7243
  output_directory: null

plot_non_consensus_stack:
  input_root: *iso7243
  output_directory: null
  population_weights_path: *population

country_cells:
  country_codes: [JPN, THA]
  boundaries: null # use the cached pinned Natural Earth boundaries
  boundary_cache: *boundaries
  output: results/REPLACE_WITH_ERA5_RUN/country/cells.csv

extract_country:
  country_codes: [JPN, THA]
  implementations: *targets
  runs: *runs
  start_date: *start
  end_date: *end
  output_directory: results/REPLACE_WITH_ERA5_RUN/country
  boundaries: null
  boundary_cache: *boundaries
  bounds: null # optional [west, south, east, north]; one country only
  overwrite: false

country_classification: &country_classification_settings
  cache_path: &jpn_cache results/REPLACE_WITH_ERA5_RUN/country/jpn/observations.parquet
  start_date: *start
  end_date: *end
  thresholds_c: &jpn_thresholds [21, 25, 28, 31]
  implementations: *targets
  output_root: results/REPLACE_WITH_ERA5_RUN/country/jpn/classification

country_classification_tha:
  <<: *country_classification_settings
  cache_path: &tha_cache results/REPLACE_WITH_ERA5_RUN/country/tha/observations.parquet
  thresholds_c: &tha_thresholds [30, 32, 34]
  output_root: results/REPLACE_WITH_ERA5_RUN/country/tha/classification

iso7243_jpn: &country_iso7243_settings
  <<: *iso7243_settings
  hsb_run_paths: null
  country_cache: *jpn_cache
  thresholds_c: *jpn_thresholds
  output_root: &jpn_iso7243 results/REPLACE_WITH_ERA5_RUN/country/jpn/iso7243
  date_workers: 1

iso7243_tha:
  <<: *country_iso7243_settings
  country_cache: *tha_cache
  thresholds_c: *tha_thresholds
  output_root: &tha_iso7243 results/REPLACE_WITH_ERA5_RUN/country/tha/iso7243

plot_iso7243_jpn:
  <<: *plot_iso7243_settings
  input_root: *jpn_iso7243

plot_iso7243_tha:
  <<: *plot_iso7243_settings
  input_root: *tha_iso7243

plot_non_consensus_jpn:
  <<: *plot_non_consensus_settings
  input_root: *jpn_iso7243

plot_non_consensus_tha:
  <<: *plot_non_consensus_settings
  input_root: *tha_iso7243

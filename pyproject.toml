[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liljegren-wbgt-analysis"
version = "0.1.0"
description = "Analysis and comparison of Liljegren WBGT implementations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb",
    "numpy",
    "pyarrow",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "matplotlib",
    "openpyxl",
    "pandas",
    "pytest>=9.1.1",
    "scikit-learn",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "liljegren-wbgt-analysis"
version = "0.1.0"
description = "Analysis and comparison of Liljegren WBGT implementations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "polars>=1.44.1",
    "pyarrow",
    "rasterio",
    "rioxarray",
    "shapely>=2.1,<3",
    "xarray",
]

[dependency-groups]
dev = [
    "ipykernel",
    "ipywidgets>=8.1.9",
    "jupyterlab",
    "matplotlib",
    "openpyxl",
    "plotly>=6.9.0",
    "pytest>=9.1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

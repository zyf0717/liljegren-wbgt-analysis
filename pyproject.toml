[project]
name = "liljegren-wbgt-analysis"
version = "0.1.0"
description = "Analysis and comparison of Liljegren WBGT implementations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "openpyxl",
    "pandas",
    "polars>=1.44.1",
    "pyarrow",
    "rasterio",
    "shapely>=2.1,<3",
    "pyyaml",
    "ipykernel",
    "ipywidgets>=8.1.9",
    "jupyterlab",
    "matplotlib",
    "plotly>=6.9.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = ["pytest>=9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
